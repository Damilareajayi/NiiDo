name: Auto-Translate Synchronization

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/src/i18n/locales/en.json'

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute Translation Sync Script
        run: |
          cd frontend
          npx ts-node --transpile-only scripts/translate.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Updated Translations
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(i18n): automatically synchronize global language translations [skip ci]"
          file_pattern: 'frontend/src/i18n/locales/*.json'
